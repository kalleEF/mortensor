url: ~
template:
  bootstrap: 5
  includes:
    # Mermaid diagrams (function map, README): fenced ```mermaid blocks are
    # turned into diagrams in the browser
    in_header: |
      <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
      mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
      window.addEventListener("load", async () => {
        const sel = "pre.mermaid, pre.sourceCode.mermaid, pre > code.mermaid, pre > code.language-mermaid";
        document.querySelectorAll(sel).forEach((el) => {
          const pre = el.tagName === "PRE" ? el : el.parentElement;
          const div = document.createElement("div");
          div.className = "mermaid-diagram";
          div.textContent = pre.textContent;
          pre.replaceWith(div);
        });
        await mermaid.run({ querySelector: "div.mermaid-diagram" });
      });
      </script>
