url: ~
template:
  bootstrap: 5
reference:
  - title: 1. Read data
    desc: Deaths, exposures and populations in long or wide tables, at any age and period resolution.
    contents:
      - mt_data
      - mt_add
      - parse_age_labels
      - as_mt_data
      - mt_from_hmd
      - mt_read_genesis
      - mt_read_gbe
  - title: 2. Prepare and check
    desc: Analysis decisions on exposures, ages, years, strata, aggregation layers and suppressed cells.
    contents:
      - mt_as_exposure
      - mt_subset
      - mt_group_levels
      - mt_relabel
      - mt_fill_suppressed
      - mt_validate
      - mt_strata
  - title: 3. Harmonise age groups and periods
    desc: Common resolution of all tables; ungrouping and smoothing; preprocessing pipelines refitted in backtests.
    contents:
      - mt_regroup
      - mt_ungroup
      - ungroup-diagnostics
      - mt_smooth
      - mt_smooth_check
      - mt_prep
      - mt_set_grid
  - title: 4. Describe the past
    desc: Observed indicators with Poisson intervals, gaps between strata, inequality indices, lifespan variation, decompositions and excess mortality (which also work on forecasts).
    contents:
      - mt_observed
      - life_expectancy
      - derived
      - mt_contrast
      - mt_plot_contrast
      - mt_inequality
      - lifespan_variation
      - mt_decompose
      - mt_plot_decomposition
      - standard_population
      - life_table
      - mt_excess
  - title: 5. Models for one population
    contents:
      - lee_carter
      - rwd
      - p_splines
      - cp_splines
      - hyndman_ullah
      - coda
      - bohk_rau
      - stmomo
      - stanmomo
      - arima_series
      - apc_bayes
      - apc_select
      - mcmc_control
      - nordpred_apc
  - title: 6. Models for several populations and causes
    contents:
      - li_lee
      - cae
      - coherent_fdm
      - tucker3
      - cause_shares
      - coda_causes
      - product_ratio
  - title: 7. Combine models and make forecasts coherent
    desc: Model wrappers (ensembles, different models for groups of strata, reconciliation, coupling, calibration, jump-off, bootstrap, tuning) and hierarchies of strata.
    contents:
      - ensemble
      - stratified
      - reconciled
      - coupled
      - recalibrated
      - anchored
      - bootstrapped
      - mt_tune
      - mt_hierarchy
      - mt_aggregate_strata
      - mt_reconcile
      - mt_coherence
      - mt_aggregate_draws
      - mt_order_strata
  - title: 8. Fit, inspect and forecast
    contents:
      - mt_fit
      - mt_parameters
      - fit-inspection
      - mt_plot_residuals
      - mt_forecast
      - mt_jump_off
      - mt_draws
      - mt_deaths
      - mt_disaggregate
      - mt_shape_rates
      - mt_disaggregate_check
  - title: 9. Evaluate and compare
    desc: Rolling-origin backtests and scores; tests of differences in accuracy; several models and forecasts side by side.
    contents:
      - mt_backtest
      - mt_score
      - mt_dm_test
      - mt_compare
      - mt_plot_design
  - title: 10. Report
    contents:
      - mt_plot
      - mt_plot_more
      - mt_plot_style
      - mt_export
  - title: Example data
    contents:
      - ons_data
      - de_deaths
      - mt_example
      - mt_example_causes
      - mt_example_regions
  - title: Exchange with other packages
    contents:
      - as_demogdata
  - title: Low level and extending
    desc: Building blocks for advanced use and for new models.
    contents:
      - mt_axis
      - axis_widths
      - mt_array
      - mt_granularity
      - mt_operator
      - new_mt_spec
articles:
  - title: Getting started
    navbar: ~
    contents:
      - mortensor
      - own-data
      - articles/function-map
  - title: Concepts, one at a time
    desc: Each article explains one step with a simple model and figures.
    contents:
      - ungrouping
      - smoothing
      - jump-off
      - backtesting
      - tuning-recalibration
      - coherence
      - dependence
      - decomposition
      - lifespan-variation
  - title: Models
    desc: Which model to use, and how to combine several.
    contents:
      - model-choice
      - models
      - bayesian-apc
      - comparison
  - title: Applications
    desc: Complete analyses from the published tables to the reported results.
    contents:
      - inequality-england
      - laender-germany
      - excess-mortality
  - title: Help
    contents:
      - faq
      - articles/methods-sources
