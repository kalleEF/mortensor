# R CMD check. R 4.3 is the minimum version declared in DESCRIPTION and is
# tested explicitly.
# CI budget: development branches run no workflows on push (checks run
# locally before each commit). Pull requests and pushes to main run Ubuntu
# jobs only; Windows and R-devel run monthly; macOS (billed at ten times the
# Linux rate) only when started by hand.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "dev/**"
      - "**.md"
      - "validation/history.csv"
      - ".claude/**"
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "dev/**"
      - "**.md"
      - "validation/history.csv"
      - ".claude/**"
  schedule:
    - cron: '41 2 1 * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'linux, extended (adds R-devel, oldrel and Windows) or all (adds macOS)'
        required: true
        default: 'linux'

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event.inputs.platforms == 'all' && '[{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"},{"os":"ubuntu-latest","r":"4.3"},{"os":"windows-latest","r":"release"},{"os":"macos-latest","r":"release"}]') || ((github.event_name == 'schedule' || github.event.inputs.platforms == 'extended') && '[{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"},{"os":"ubuntu-latest","r":"4.3"},{"os":"windows-latest","r":"release"}]') || '[{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"4.3"}]') }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
