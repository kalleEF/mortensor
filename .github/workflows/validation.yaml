# Validation pipeline (validation/README.md): accuracy, calibration and runtime
# benchmarks with thresholds. The quick suite runs on every push and pull
# request, the full suite weekly and on demand. The job fails when a metric
# breaches its threshold; the report is attached as an artifact and shown in
# the job summary.
on:
  push:
    branches: [main, master, "dev-*", "claude/**"]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (quick or full)'
        required: true
        default: 'full'

name: validation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SUITE: ${{ github.event.inputs.suite || (github.event_name == 'schedule' && 'full') || 'quick' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::StMoMo, any::demography, any::forecast, any::bamp, local::.
          needs: validation

      - name: Run validation (${{ env.SUITE }})
        run: Rscript validation/run_validation.R --suite "$SUITE" --out validation-output
        env:
          OPENBLAS_NUM_THREADS: 1

      - name: Job summary
        if: always()
        run: cat validation-output/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ env.SUITE }}-${{ github.sha }}
          path: validation-output
